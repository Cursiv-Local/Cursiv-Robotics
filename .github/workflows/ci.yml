name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --release --locked
      - name: Rust tests (unit, integration, property, mutation fuzz)
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Python dependencies
        run: python -m pip install pytest cryptography bagit securesystemslib mcap mcap-ros2-support prov
      - name: Python tests (simulation lab, virtual missions vs documented results, phone importer, integration, interop)
        timeout-minutes: 15
        run: python -m pytest tests -v -o faulthandler_timeout=120
      - name: One-command demo (PowerShell)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\demo.ps1
      - name: One-command demo (sh)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: sh scripts/demo.sh
      - name: Benchmark (software on the CI runner, not robot hardware)
        shell: bash
        run: cargo run --release --locked -p cursiv-evidence --example bench -- 5000 3 bench-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json

  msrv:
    name: Rust 1.82 (minimum supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - run: cargo test --locked --workspace

  audit:
    name: Dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  ros2:
    name: ROS 2 Jazzy integration (simulated publishers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ROS 2 Jazzy (ros-base, sensor_msgs)
        run: |
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ros-jazzy-ros-base ros-jazzy-sensor-msgs python3-cryptography
      - run: cargo build --release --locked
      - name: Test dependencies
        run: python3 -m pip install --break-system-packages pytest mcap mcap-ros2-support prov
      - name: Live ROS 2 graph test, capture core and MCAP tests
        env:
          CURSIV_ROS_PYTHON: /usr/bin/python3
        run: python3 -m pytest tests/test_ros2.py tests/test_ros2_core.py tests/test_mcap.py -v
      - name: ROS 2 quick start (scripts/ros2_quickstart.sh)
        env:
          CURSIV_ROS_PYTHON: /usr/bin/python3
        run: bash scripts/ros2_quickstart.sh
