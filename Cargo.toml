[workspace]
resolver = "2"
members = ["crates/cursiv-evidence", "crates/cursiv-bridge", "crates/cursiv-verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Joshua Winkler"]
repository = "https://github.com/Cursiv-Local/Cursiv-Robotics"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
debug = false
